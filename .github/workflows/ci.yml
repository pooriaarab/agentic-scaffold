name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    env:
      WRANGLER_SEND_METRICS: "false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/consumer-smoke.mjs

  identity-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        identity: ["0.9.0", "0.10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install --no-save --package-lock=false agentic-identity@${{ matrix.identity }}
      - run: npm run typecheck
      - run: npm test
