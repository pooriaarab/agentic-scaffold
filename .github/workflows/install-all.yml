name: install-all

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-all:
    env:
      WRANGLER_SEND_METRICS: "false"
      npm_config_cache: ${{ runner.temp }}/npm-cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install all latest packages together
        run: npm run install-all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: install-all-npm-logs
          path: |
            ${{ runner.temp }}/npm-cache/_logs/*-eresolve-report.txt
            ${{ runner.temp }}/npm-cache/_logs/*-debug-*.log
          if-no-files-found: ignore
